      overflow: hidden;

    #mvcc-conviction-line {
      position: relative;
      isolation: isolate;
      contain: strict;
      background:
        radial-gradient(ellipse at 77% 47%, rgba(122, 0, 0, 0.16) 0%, rgba(122, 0, 0, 0.065) 31%, transparent 58%),
        radial-gradient(ellipse at 87% 25%, rgba(212, 175, 55, 0.055) 0%, transparent 32%),
        linear-gradient(128deg, #ffffff 0%, #fbfaf7 52%, #ffffff 100%);
    }

    #mvcc-conviction-line::before,
    #mvcc-conviction-line::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
    }

    #mvcc-conviction-line::before {
      background:
        linear-gradient(112deg, transparent 48%, rgba(212, 175, 55, 0.045) 59%, transparent 71%),
        repeating-linear-gradient(116deg, rgba(23, 18, 23, 0.018) 0 1px, transparent 1px 9px);
      mix-blend-mode: multiply;
      opacity: 0.74;
    }

    #mvcc-conviction-line::after {
      opacity: 0.12;
      background-image:
        radial-gradient(circle, rgba(23, 18, 23, 0.32) 0 0.5px, transparent 0.75px),
        radial-gradient(circle, rgba(122, 0, 0, 0.32) 0 0.5px, transparent 0.75px);
      background-position: 0 0, 3px 2px;
      background-size: 5px 5px, 7px 7px;
      mix-blend-mode: multiply;
    }

    .mvcc-art {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .layout-ready .mvcc-art {
      opacity: 1;
    }

    .field-contours path,
    .feeder,
    .material-path,
    .construction-axis,
    .construction-guide,
    .echo-flash {
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .field-contours path {
      stroke: rgba(23, 18, 23, 0.14);
      stroke-width: 1;
      opacity: 0;
    }

    .feeder,
    .material-path,
    .tension-path,
    .echo-flash {
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feeder-red {
      stroke: #7A0000;
      stroke-width: 2.3;
    }

    .feeder-gold {
      stroke: #D4AF37;
      stroke-width: 2.15;
    }

    .material-path {
      fill: none;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      stroke-width: 2.3;
      opacity: 0;
      vector-effect: none;
    }

    .material-red {
      stroke: #7A0000;
    }

    .material-gold {
      stroke: #D4AF37;
    }

    .sparkle-field {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      left: var(--spark-x);
      top: var(--spark-y);
      width: var(--spark-size);
      height: var(--spark-size);
      color: #7A0000;
      background: currentColor;
      opacity: var(--spark-opacity);
      clip-path: polygon(50% 0%, 59% 41%, 100% 50%, 59% 59%, 50% 100%, 41% 59%, 0% 50%, 41% 41%);
      transform: translate(-50%, -50%) rotate(var(--spark-rotation));
      mix-blend-mode: multiply;
    }

    .sparkle.gold {
      color: #D4AF37;
    }

    .construction-axis {
      stroke: rgba(23, 18, 23, 0.17);
      stroke-width: 1;
      stroke-dasharray: 5 7;
    }

    .construction-guide {
      stroke: rgba(212, 175, 55, 0.38);
      stroke-width: 1.15;
      stroke-dasharray: 7 6;
    }

    .anchor-halo {
      fill: rgba(122, 0, 0, 0.24);
    }

    .anchor-halo.gold {
      fill: rgba(212, 175, 55, 0.18);
    }

    .anchor-core {
      fill: var(--mvcc-paper);
      stroke: #7A0000;
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .anchor-core.gold {
      stroke: #D4AF37;
    }

    .tension-path {
      fill: none;
      stroke-width: 2.3;
      opacity: 0;
      vector-effect: none;
    }

    .tension-red {
      stroke: #7A0000;
    }

    .tension-gold {
      stroke: #D4AF37;
    }

    .vector-wordmark {
      fill: #7A0000;
    }

    .vector-wordmark path {
      fill-opacity: 0;
      shape-rendering: geometricPrecision;
    }

    .echo-flash {
      stroke-width: 1.5;
      opacity: 0;
    }

    .flash-red {
      stroke: #7A0000;
    }

    .flash-gold {
      stroke: #D4AF37;
    }

    .anchor {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;

    .feed-one,
    .anchor-one,

      --feed-delay: 0s;
    }

    .feed-two,
    .anchor-two,
    .material-two {

    .feed-three,
    .anchor-three,
    .material-three {
      --feed-delay: 0.44s;
    }

    .feed-four,
    .anchor-four,
    .material-four {
      --feed-delay: 0.66s;
    }

    .feed-five,
    .anchor-five,
    .material-five {
      --feed-delay: 0.88s;

    .is-playing .field-contours path {
      animation: contour-breathe var(--mvcc-duration) ease both;
    }

    .is-playing .field-contours path:nth-child(2) {
      animation-delay: 0.18s;
    }

    .is-playing .field-contours path:nth-child(3) {
      animation-delay: 0.36s;
    }

    .is-playing .field-contours path:nth-child(4) {
      animation-delay: 0.54s;

    .is-playing .construction-axis,
    .is-playing .construction-guide,

      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .is-playing .feeder {
      animation: feeder-deliver var(--mvcc-duration) var(--feed-delay, 0s) cubic-bezier(0.53, 0.06, 0.22, 1) both;
    }

    .is-playing .material-path {
      animation: material-transfer var(--mvcc-duration) var(--feed-delay, 0s) cubic-bezier(0.53, 0.06, 0.22, 1) both;
    }

    .is-playing .construction-axis {
      animation: axis-arrive var(--mvcc-duration) ease both;
    }

    .is-playing .axis-two {
      animation-delay: 0.22s;
    }

    .is-playing .axis-three {
      animation-delay: 0.66s;
    }

    .is-playing .construction-guide {
      animation: guide-arrive var(--mvcc-duration) ease both;
    }

    .is-playing .guide-one {
      animation-delay: 0.22s;
    }

    .is-playing .guide-two {
      animation-delay: 0s;
    }

    .is-playing .guide-three {
      animation-delay: 0.66s;
    }

    .is-playing .anchor {
      animation: anchor-receive var(--mvcc-duration) var(--feed-delay, 0s) cubic-bezier(0.5, 0, 0.22, 1) both;
    }

    .is-playing .tension-path {
      animation: tension-lock var(--mvcc-duration) cubic-bezier(0.58, 0, 0.2, 1) both;
    }

    .is-playing .vector-wordmark path {
      animation: word-lock 2.55s 9.93s ease both;
    }

    .is-playing.wordmark-settled .vector-wordmark path {
      animation: none;
      fill-opacity: 1;
    }

    .is-playing .echo-flash {
      animation: resolved-flash var(--mvcc-duration) 0.4s ease both;
    }

      0% { opacity: 0; transform: translateX(12px); }
      12%, 38% { opacity: 0.42; transform: translateX(0); }
      61%, 100% { opacity: 0.1; transform: translateX(-4px); }

      4% { opacity: 0.9; }
      27% { stroke-dashoffset: 0; opacity: 1; }
      39%, 100% { stroke-dashoffset: -1; opacity: 0; }

    @keyframes material-transfer {

      27% { stroke-dashoffset: 1; stroke-width: 2.3; opacity: 1; }
      39%, 45% { stroke-dashoffset: 0; stroke-width: 2.3; opacity: 1; }
      51%, 100% { stroke-dashoffset: 0; stroke-width: 5; opacity: 0; }

    @keyframes axis-arrive {

      39% { stroke-dashoffset: 0; opacity: 0.34; }

      29% { opacity: 0.74; }
      39% { stroke-dashoffset: 0; opacity: 0.62; }

    @keyframes anchor-receive {

      12% { opacity: 0.22; transform: scale(0.58); }
      20% { opacity: 0.56; transform: scale(0.82); }
      27% { opacity: 1; transform: scale(1.34); }
      32%, 39% { opacity: 1; transform: scale(1); }
      45% { opacity: 1; transform: scale(0.55); }
      49%, 100% { opacity: 0; transform: scale(0.06); }
    }

    @keyframes tension-lock {
      0%, 44.2% { stroke-width: 2.3; opacity: 0; }
      45% { stroke-width: 2.3; opacity: 1; }
      56%, 100% { stroke-width: 15; opacity: 1; }
    }

    @keyframes word-lock {
      from { fill-opacity: 0; }
      to { fill-opacity: 1; }
    }

    @keyframes resolved-flash {
      0%, 51% { stroke-dashoffset: 1; opacity: 0; }
      56% { opacity: 0.5; }
      64% { stroke-dashoffset: 0; opacity: 0.09; }
      71%, 100% { opacity: 0; }

    <p class="screen-reader-copy">Five fine red and gold filaments arrive at synchronized structural anchor points. As each tail is absorbed, a matching logo segment grows by the same amount, resolving into the McMaster Venture Capital Club mark over seventy-two small red and gold sparkles.</p>
  </div>

  <script>
    (() => {
      const root = document.getElementById("mvcc-conviction-line");
      const art = document.getElementById("mvcc-art");
      const scene = document.getElementById("mvcc-scene");
      const sparkleField = root.querySelector(".sparkle-field");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const device = typeof navigator === "undefined" ? {} : navigator;
      const connection = device.connection || device.mozConnection || device.webkitConnection;
      const lowPowerDevice =
        (Number(device.deviceMemory) > 0 && Number(device.deviceMemory) <= 4) ||
        (Number(device.hardwareConcurrency) > 0 && Number(device.hardwareConcurrency) <= 4) ||
        Boolean(connection && connection.saveData);
      let layoutMode = null;
      let layoutTimer = 0;
      let animationStarted = false;
      let layoutObserver = null;

      if (lowPowerDevice) root.classList.add("is-low-power");

      function buildSparkleField() {
        const fragment = document.createDocumentFragment();
        let seed = 72437;

        function random() {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        }

        for (let row = 0; row < 6; row += 1) {
          for (let column = 0; column < 12; column += 1) {
            const index = row * 12 + column;
            const star = document.createElement("span");
            const x = ((column + 0.14 + random() * 0.72) / 12) * 100;
            const y = ((row + 0.14 + random() * 0.72) / 6) * 100;
            const size = 3.6 + random() * 2.6;
            const opacity = 0.5 + random() * 0.32;
            const rotation = random() * 360;

            star.className = `sparkle${index % 2 ? " gold" : ""}`;
            star.style.setProperty("--spark-x", `${x.toFixed(3)}%`);
            star.style.setProperty("--spark-y", `${y.toFixed(3)}%`);
            star.style.setProperty("--spark-size", `${size.toFixed(2)}px`);
            star.style.setProperty("--spark-opacity", opacity.toFixed(2));
            star.style.setProperty("--spark-rotation", `${rotation.toFixed(2)}deg`);
            fragment.appendChild(star);
          }
        }

        sparkleField.appendChild(fragment);
        sparkleField.dataset.count = "72";
      }

      function getStableMode(width) {
        if (layoutMode === "mobile" && width > 760) return "desktop";
        if (layoutMode === "desktop" && width < 640) return "mobile";
        return layoutMode || (width < 700 ? "mobile" : "desktop");
      }

      function applyLayout() {
        const width = Math.max(root.clientWidth, document.documentElement.clientWidth, window.innerWidth || 0);
        const nextMode = getStableMode(width);
        layoutMode = nextMode;
        art.setAttribute("preserveAspectRatio", "xMidYMid meet");

        if (nextMode === "mobile") {
          art.setAttribute("viewBox", "650 0 780 960");
          scene.setAttribute("transform", "translate(0 145)");
        } else {
          art.setAttribute("viewBox", "0 0 1440 720");
          scene.setAttribute("transform", "translate(0 -100)");
        }

        root.dataset.layout = nextMode;
      }

      function finalizeLayout() {
        applyLayout();
        root.classList.add("layout-ready");
        if (!animationStarted) {
          animationStarted = true;
          play();
        }
      }

      function queueLayout() {
        window.clearTimeout(layoutTimer);
        layoutTimer = window.setTimeout(finalizeLayout, 280);
      }

      function play() {
        root.classList.remove("is-playing", "is-reduced", "wordmark-settled");
        void root.offsetWidth;
        root.classList.add(reducedMotion.matches ? "is-reduced" : "is-playing");
      }

      art.addEventListener("animationend", (event) => {
        if (event.animationName === "word-lock") {
          root.classList.add("wordmark-settled");
        }
      });

      if (typeof reducedMotion.addEventListener === "function") {
        reducedMotion.addEventListener("change", play);
      } else if (typeof reducedMotion.addListener === "function") {
        reducedMotion.addListener(play);
      }

      window.addEventListener("resize", queueLayout, { passive: true });
      window.addEventListener("load", queueLayout, { once: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", queueLayout, { passive: true });
      }
      if (typeof ResizeObserver === "function") {
        layoutObserver = new ResizeObserver(queueLayout);
        layoutObserver.observe(root);
      }
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "mvcc-hero" && event.data.action === "replay") play();
      });

      buildSparkleField();
      queueLayout();
    })();
  </script>
